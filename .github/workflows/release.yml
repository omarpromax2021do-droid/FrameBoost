name: Build and Publish Framewise Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute versionName and versionCode
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION_NAME="${RAW_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%-*}"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          RUN_NUMBER=${GITHUB_RUN_NUMBER:-1}
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + (RUN_NUMBER % 100)))
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }} --no-daemon

      - name: Sign Release APK (if keystore provided)
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_OR_DEBUG_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ "$HAS_KEYSTORE" = "true" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
            "$APKSIGNER" sign \
              --ks app/release.keystore \
              --ks-pass env:KEYSTORE_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "FrameBoost-v${{ steps.version.outputs.version_name }}.apk" \
              "$UNSIGNED_OR_DEBUG_APK"
          else
            cp "$UNSIGNED_OR_DEBUG_APK" "FrameBoost-v${{ steps.version.outputs.version_name }}.apk"
          fi
          sha256sum "FrameBoost-v${{ steps.version.outputs.version_name }}.apk" > "FrameBoost-v${{ steps.version.outputs.version_name }}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FrameBoost ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            FrameBoost-v${{ steps.version.outputs.version_name }}.apk
            FrameBoost-v${{ steps.version.outputs.version_name }}.apk.sha256
